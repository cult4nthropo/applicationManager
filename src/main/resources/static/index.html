<!DOCTYPE html>
<html>
<head>
    <title>Bewerbungsmanager</title>

    <style>
    body {
        font-family: Arial, sans-serif;
        margin: 30px;
    }

    .container {
    display: flex;
    align-items: flex-start;
    gap: 30px;
	}

	.left {
	    flex: 1;
	    float: left;
	    min-width: 45%;
	}
	
	.right {
	    flex: 1;
	    float: right;
	    min-width: 45%;
	}
	
	iframe {
    width: 100%;
    max-width: 100%;
    height: 600px;
    border: 1px solid #ccc;
}

    .section {
        border: 1px solid #ccc;
        padding: 15px;
        margin-bottom: 25px;
        border-radius: 8px;
    }

    h2 {
        margin-top: 0;
    }

    input, textarea {
        width: 100%;
        padding: 6px;
        margin-bottom: 10px;
    }

    textarea {
        height: 120px;
    }

    button {
        padding: 8px 12px;
        margin-right: 5px;
        cursor: pointer;
    }

</style>
<body>
<!-- ================= LEFT SIDE ================= -->
<div class="left">

    <!-- ===== Anschreiben ===== -->
    <div class="section">
        <h2>Anschreiben</h2>

        <input id="cl_sender_name" class="cover_letter" placeholder="Sender Name" oninput=previewCoverLetter()>
        <input id="cl_sender_street" class="cover_letter" placeholder="Sender Straße" oninput=previewCoverLetter()>
        <input id="cl_sender_city" class="cover_letter" placeholder="Sender Stadt" oninput=previewCoverLetter()>
        <br>
        <br>
        <input id="cl_receiver_name" class="cover_letter" placeholder="Empfänger Name"  oninput=previewCoverLetter()>
        <input id="cl_receiver_street" class="cover_letter" placeholder="Empfänger Straße"  oninput=previewCoverLetter()>
        <input id="cl_receiver_city" class="cover_letter" placeholder="Empfänger Stadt"  oninput=previewCoverLetter()>
        <input id="cl_subject" class="cover_letter" placeholder="Betreff"  oninput=previewCoverLetter()>
        <textarea id="cl_text" class="cover_letter" placeholder="Text"  oninput=previewCoverLetter()></textarea>

        <button onclick="saveCoverLetter()">Speichern</button>
        <button onclick="createCoverLetterPdf()">PDF</button>
    </div>

    <!-- ===== Lebenslauf ===== -->
    <div class="section">
        <h2>Lebenslauf</h2>

        <input id="cv_name" placeholder="Name">
        <input id="cv_email" placeholder="Email">
        <input id="cv_phone" placeholder="Telefon">

        <input type="file" id="cv_photo">

        <button onclick="saveCv()">Speichern</button>
        <button onclick="createCvPdf()">PDF</button>
    </div>

    <!-- ===== Dokumente ===== -->
    <div class="section">
        <h2>Dokumente</h2>

        <input type="file" id="documents" multiple>
        <button onclick="uploadDocuments()">Upload</button>
    </div>

    <!-- ===== Gesamt ===== -->
    <div class="section">
        <h2>Gesamtbewerbung</h2>
        <button onclick="createApplicationPdf()">Gesamt-PDF erstellen</button>
    </div>

</div>

<!-- ================= RIGHT SIDE (PREVIEW) ================= -->
<div class="right">
    <h2>Live Vorschau Anschreiben</h2>
    <iframe id="previewCoverLetter"></iframe>
    <h3>Lebenslauf</h3>
	<iframe id="previewCv"></iframe>
</div>

<script>
const base = "/api/applications";
const id = 1; 

function saveCoverLetter() {
    fetch(`${base}/${id}/coverletter`, {
        method: "PUT",
        headers: { "Content-Type": "text/plain" },
        body: document.getElementById("previewCoverLetter").value
    });
}

function previewCoverLetter() {
    const data = {
        applicant: {
			senderName: document.getElementById("cl_sender_name").value,
			senderStreet: document.getElementById("cl_sender_street").value,
            senderCity: document.getElementById("cl_sender_city").value
        },
        recipient: {
        	receiverName: document.getElementById("cl_receiver_name").value,
			receiverStreet: document.getElementById("cl_receiver_street").value,
            receiverCity: document.getElementById("cl_receiver_city").value
        },
        subject: document.getElementById("cl_subject").value,
        text: document.getElementById("cl_text").value
    };

    fetch(`${base}/${id}/coverletter/preview`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    })
    .then(res => res.text())
    .then(html => {
        document.getElementById("previewCoverLetter").srcdoc = html;
    });
}

function previewCv() {
    document.getElementById("previewCv").src =
        `${base}/${id}/cv/preview`;
}

function updateColor() {
    const color = document.getElementById("colorPicker").value;

    fetch(`${base}/${id}/cv/color?color=${color}`, {
        method: "PATCH"
    });
}

function generatePdf() {
    fetch(`${base}/${id}/generate-pdf`, { method: "POST" });
}

function createApplicationPdf() {
    document.getElementById("pdfPreview").src =
        `${base}/${id}/pdf`;
}
</script>

</body>
</html>
