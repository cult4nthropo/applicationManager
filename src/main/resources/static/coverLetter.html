<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Letter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 60px;
            line-height: 1.6;
        }
        .applicant { margin-bottom: 40px; }
        .recipient { margin-bottom: 40px; }
        .date { text-align: right; margin-bottom: 40px; }
        .subject { font-weight: bold; margin-bottom: 20px; }
        .content { margin-top: 20px; }
    </style>
</head>
<body>

<div class="sender">
    <p>${senderAddress}</p>
</div>

<div class="applicant">
    <p>${applicant}</p>
</div>

<div class="date">
    <p>${city}, {date}</p>
</div>

<div class="subject">
    <p>${subject}</p>
</div>

<div class="content">
    ${text}
</div>

</body>
</html>
